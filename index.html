<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasturi Divine | Numerology Energy Wheel</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --purple:#4b1b7a;
  --violet:#6d28d9;
  --gold:#facc15;
  --bg:#faf7ff;
  --dark:#1f1b2e;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:var(--bg);
  color:var(--dark);
}
h1,h2,h3{font-family:Cinzel,serif}
a{text-decoration:none}

/* ===== HEADER ===== */
header{
  position:sticky;top:0;z-index:100;
  background:#fff;border-bottom:1px solid #eee;
}
.navbar{
  max-width:1200px;margin:auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:48px}
.brand span{font-weight:800;color:var(--purple);font-size:20px}
nav a{margin:0 10px;font-weight:700;color:var(--purple)}
nav a:hover{color:var(--violet)}
.menu-btn{display:none;font-size:26px;font-weight:bold}

.mobile-menu{display:none;padding:10px}
.mobile-menu a{display:block;padding:10px;font-weight:700;color:var(--purple)}

.event-btn{
  margin:8px auto;
  display:block;
  width:max-content;
  padding:8px 20px;
  border-radius:999px;
  background:var(--gold);
  font-weight:800;
}

/* ===== HERO ===== */
.hero{
  background:linear-gradient(135deg,#3b176b,#6d28d9);
  color:#fff;
  padding:70px 16px;
}
.hero-inner{
  max-width:1200px;margin:auto;
  display:grid;
  grid-template-columns:1fr 2fr 1fr;
  align-items:center;
  gap:20px;
  text-align:center;
}
.hero img{width:120px;border-radius:20px}
.hero h1{font-size:36px}
.hero-btn{
  margin:10px;
  padding:14px 30px;
  border-radius:999px;
  border:2px solid var(--gold);
  font-weight:800;
}
.btn-gold{background:var(--gold);color:#000}
.btn-dark{background:#3b176b;color:#fff}

/* ===== WHEEL ===== */
#wheel-section{text-align:center;padding:80px 16px}
.wheel-wrap{position:relative;width:320px;margin:40px auto}
.pointer{
  position:absolute;
  top:-22px;
  left:50%;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:12px solid transparent;
  border-right:12px solid transparent;
  border-bottom:22px solid #000;
  z-index:10;
}
.led{
  position:absolute;
  top:-36px;
  left:50%;
  transform:translateX(-50%);
  width:12px;height:12px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 12px #22c55e;
  display:none;
}
.led.on{display:block;animation:blink .6s infinite}

@keyframes blink{50%{opacity:.2}}

.wheel{
  width:320px;height:320px;border-radius:50%;
  border:10px solid var(--gold);
  background:conic-gradient(
    #4ade80 0deg 40deg,
    #facc15 40deg 80deg,
    #38bdf8 80deg 120deg,
    #22c55e 120deg 160deg,
    #fb7185 160deg 200deg,
    #fb923c 200deg 240deg,
    #16a34a 240deg 280deg,
    #1d4ed8 280deg 320deg,
    #6366f1 320deg 360deg
  );
  transition:transform 4s cubic-bezier(.17,.67,.28,1);
  position:relative;
}
.wheel span{
  position:absolute;
  left:50%;top:50%;
  transform-origin:50% 140px;
  font-weight:800;
}
.n1{transform:rotate(20deg) translateY(-140px)}
.n2{transform:rotate(60deg) translateY(-140px)}
.n3{transform:rotate(100deg) translateY(-140px)}
.n4{transform:rotate(140deg) translateY(-140px)}
.n5{transform:rotate(180deg) translateY(-140px)}
.n6{transform:rotate(220deg) translateY(-140px)}
.n7{transform:rotate(260deg) translateY(-140px)}
.n8{transform:rotate(300deg) translateY(-140px)}
.n9{transform:rotate(340deg) translateY(-140px)}

.center{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:110px;height:110px;
  border-radius:50%;
  background:#fff;
  border:6px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;cursor:pointer;
}

/* ===== TOOLS ===== */
.tools{padding:80px 16px}
.tool{
  max-width:600px;margin:12px auto;
  padding:18px 20px;
  border:2px solid var(--gold);
  border-radius:18px;
  font-weight:800;
  display:flex;gap:12px;align-items:center;
  background:#fff;
}

/* ===== FOOTER ===== */
footer{
  background:#fff;
  padding:40px 16px;
  text-align:center;
}
footer .cta{
  padding:14px 30px;
  border-radius:999px;
  border:2px solid var(--gold);
  font-weight:800;
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .hero-inner{grid-template-columns:1fr}
  nav{display:none}
  .menu-btn{display:block}
}
</style>
</head>

<body>

<header>
  <div class="navbar">
    <div class="brand">
      <img src="logo.png">
      <span>Kasturi Divine</span>
    </div>

    <nav>
      <a href="#">Home</a>
      <a href="#wheel-section">Wheel</a>
      <a href="#tools">Tools</a>
      <a href="#">Courses</a>
      <a href="#">Contact</a>
    </nav>

    <div style="display:flex;gap:10px;align-items:center">
      <a href="https://youtube.com" target="_blank">📺</a>
      <div class="menu-btn" onclick="toggleMenu()">☰</div>
    </div>
  </div>

  <div id="mobileMenu" class="mobile-menu">
    <a href="#">Home</a>
    <a href="#wheel-section">Wheel</a>
    <a href="#tools">Tools</a>
    <a href="#">Courses</a>
    <a href="#">Contact</a>
  </div>

  <a class="event-btn">Upcoming Event</a>
</header>

<section class="hero">
  <div class="hero-inner">
    <img src="mentor-left.jpg">
    <div>
      <h1>हम सब में है कुछ खास</h1>
      <button class="hero-btn btn-gold">Explore Courses</button>
      <button class="hero-btn btn-dark">Book Consultation</button>
    </div>
    <img src="mentor-right.jpg">
  </div>
</section>

<section id="wheel-section">
  <h2>Numerology Energy Wheel</h2>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <div id="led" class="led"></div>

    <div id="wheel" class="wheel">
      <span class="n1">1</span><span class="n2">2</span><span class="n3">3</span>
      <span class="n4">4</span><span class="n5">5</span><span class="n6">6</span>
      <span class="n7">7</span><span class="n8">8</span><span class="n9">9</span>
    </div>

    <div class="center" onclick="spin()">SPIN</div>
  </div>

  <h3 id="result"></h3>
</section>

<section id="tools" class="tools">
  <h2 style="text-align:center">Numerology Tools</h2>
  <div class="tool">📱 Mobile Numerology</div>
  <div class="tool">✍️ Name Correction</div>
  <div class="tool">🍀 Lucky Number</div>
  <div class="tool">🔮 Personal Year</div>
</section>

<footer>
  <p>Book your appointment & transform your life</p>
  <button class="cta">Book Appointment</button>
</footer>

<script>
function toggleMenu(){
  const m=document.getElementById('mobileMenu');
  m.style.display=m.style.display==='block'?'none':'block';
}

const meanings={
  1:"Leadership • Confidence",
  2:"Balance • Harmony",
  3:"Creativity • Expression",
  4:"Stability • Discipline",
  5:"Change • Freedom",
  6:"Care • Responsibility",
  7:"Wisdom • Spirituality",
  8:"Power • Success",
  9:"Completion • Humanity"
};

function spin(){
  const wheel=document.getElementById('wheel');
  const led=document.getElementById('led');
  const result=document.getElementById('result');

  led.classList.remove('on');

  const num=Math.floor(Math.random()*9)+1;
  const angle=360*5 + (num-1)*40 + 20;

  wheel.style.transform=`rotate(-${angle}deg)`;

  setTimeout(()=>{
    led.classList.add('on');
    result.innerHTML=`Your Lucky Number: <b>${num}</b><br>${meanings[num]}`;
  },4000);
}
</script>

</body>
</html>
