<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kasturi Divine — Free Calculators</title>
  <meta name="description" content="Kasturi Divine — Free Numerology Calculators">
  <style>
    :root{
      --bg1:#2a1540; --bg2:#3a1f53; --text:#f7f7fb;
      --card-shadow:0 12px 28px rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         color:var(--text);
         background: radial-gradient(1200px 600px at 20% 5%, #6d4ea3 0%, transparent 60%),
                     radial-gradient(1000px 700px at 80% 10%, #8f5caa 0%, transparent 65%),
                     linear-gradient(160deg, var(--bg1), var(--bg2));}
    .container{max-width:1100px;margin:0 auto;padding:24px 16px}
    header{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
    header .brand{display:flex;align-items:center;gap:10px}
    header .brand .logo{width:36px;height:36px;border-radius:10px;background:#fff}
    header nav a{color:#e9e7ef;text-decoration:none;margin:0 10px;font-weight:600;opacity:.9}
    h1{font-size:36px;margin:10px 0 8px}
    p.lead{opacity:.85;margin:0 0 24px}
    /* cards */
    .tool-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
    .tool-card{border-radius:22px;padding:24px;background:#fff;box-shadow:var(--card-shadow);color:#101010;
               transition:transform .2s ease, box-shadow .2s ease;position:relative;overflow:hidden}
    .tool-card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.28)}
    .tool-card .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
    .tool-card .icon{width:56px;height:56px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
    .tool-card h3{margin:0 0 6px 0;font-size:18px}
    .tool-card a.try{font-weight:700;text-decoration:underline}
    /* pastel backgrounds */
    .pink{background:#FFD6DE}
    .blue{background:#D8E9FF}
    .peach{background:#FFE2B3}
    .mint{background:#D7F5E1}
    footer{opacity:.7;text-align:center;padding:30px 0}
    .wrap{background:rgba(255,255,255,.08);border-radius:20px;padding:20px}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo"></div>
        <strong>Kasturi Divine</strong>
      </div>
      <nav>
        <a href="#home">Home</a>
        <a href="#free">Tools</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <section id="home" class="wrap">
      <h1>Free Calculators</h1>
      <p class="lead">Click “Try Now” to open calculator in a centered popup window.</p>
      <div class="tool-grid">
        <!-- Destiny -->
        <div class="tool-card pink">
          <div class="top">
            <div class="icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <path d="M12 3l2.5 5 5 .8-3.7 3.6.9 5-4.7-2.5-4.7 2.5.9-5L4.5 8.8l5-.8L12 3z" stroke="#111" stroke-width="1.5"/>
              </svg>
            </div>
            <h3>Destiny Number Calculator</h3>
          </div>
          <a class="try" href="#" onclick="return openTool('./tools/destiny.html');">Try Now →</a>
        </div>

        <!-- Personal Year -->
        <div class="tool-card blue">
          <div class="top">
            <div class="icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="8" stroke="#111" stroke-width="1.5"/>
                <path d="M12 12l4-2" stroke="#111" stroke-width="1.5"/>
              </svg>
            </div>
            <h3>Personal Year Calculator</h3>
          </div>
          <a class="try" href="#" onclick="return openTool('./tools/personal-year.html');">Try Now →</a>
        </div>

        <!-- Name Numerology -->
        <div class="tool-card peach">
          <div class="top">
            <div class="icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <rect x="4" y="5" width="16" height="14" rx="2" stroke="#111" stroke-width="1.5"/>
                <path d="M8 9h8M8 13h5" stroke="#111" stroke-width="1.5"/>
              </svg>
            </div>
            <h3>Name Numerology Calculator</h3>
          </div>
          <a class="try" href="#" onclick="return openTool('./tools/name-numerology.html');">Try Now →</a>
        </div>

        <!-- Lucky Name -->
        <div class="tool-card mint">
          <div class="top">
            <div class="icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <path d="M7 7c3 0 3 3 5 3s2-3 5-3-1 10-5 10S4 7 7 7z" stroke="#111" stroke-width="1.5"/>
              </svg>
            </div>
            <h3>Lucky Name Calculator</h3>
          </div>
          <a class="try" href="#" onclick="return openTool('./tools/lucky-name.html');">Try Now →</a>
        </div>
      </div>
    </section>

    <footer>© Kasturi Divine</footer>
  </div>

  <script>
    function openTool(url){
      const w = 900, h = 700;
      const y = window.top.outerHeight/2 + window.top.screenY - (h/2);
      const x = window.top.outerWidth/2  + window.top.screenX - (w/2);
      window.open(url, '_blank',
        `popup=yes,width=${w},height=${h},left=${x},top=${y},resizable=yes,scrollbars=yes`
      );
      return false;
    }
  </script>
</body>
</html>
