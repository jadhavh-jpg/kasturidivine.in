<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kasturi Divine | Numerology Energy Wheel</title>

<link rel="icon" href="logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --purple:#4b1b7a;
  --violet:#6d28d9;
  --gold:#facc15;
  --bg:#faf7ff;
}
body{font-family:Poppins;background:var(--bg)}
h1,h2,h3{font-family:Cinzel}
::selection{background:var(--gold);color:#000}

/* GOLD BUTTON */
.gold-btn{
  border:2px solid var(--gold);
  border-radius:999px;
  padding:14px 32px;
  font-weight:800;
  background:#fff;
  transition:.3s;
}
.gold-btn:hover{
  box-shadow:0 0 24px rgba(250,204,21,.7);
  transform:translateY(-3px);
}

/* WHATSAPP ICON */
.whatsapp{
  position:fixed;
  right:20px;bottom:20px;
  background:#25D366;
  color:#fff;
  width:54px;height:54px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  z-index:99;
  transition:.3s;
}
.whatsapp:hover{
  box-shadow:0 0 20px #25D366;
  transform:translateY(-3px);
}

/* WHEEL */
.wheel-wrap{position:relative;width:300px;margin:auto}
.pointer{
  position:absolute;top:-12px;left:50%;
  transform:translateX(-50%);
  border-left:12px solid transparent;
  border-right:12px solid transparent;
  border-bottom:22px solid #000;
}
.wheel{
  width:300px;height:300px;border-radius:50%;
  border:10px solid var(--gold);
  background:conic-gradient(
    #4ade80 0deg 40deg,
    #facc15 40deg 80deg,
    #38bdf8 80deg 120deg,
    #22c55e 120deg 160deg,
    #fb7185 160deg 200deg,
    #fb923c 200deg 240deg,
    #16a34a 240deg 280deg,
    #1d4ed8 280deg 320deg,
    #6366f1 320deg 360deg
  );
  transition:transform 4s cubic-bezier(.17,.67,.25,1);
  position:relative;
}
.num{
  position:absolute;
  top:50%;left:50%;
  transform-origin:0 0;
  font-weight:800;
}
.num1{transform:rotate(20deg) translateY(-130px) rotate(-20deg)}
.num2{transform:rotate(60deg) translateY(-130px) rotate(-60deg)}
.num3{transform:rotate(100deg) translateY(-130px) rotate(-100deg)}
.num4{transform:rotate(140deg) translateY(-130px) rotate(-140deg)}
.num5{transform:rotate(180deg) translateY(-130px) rotate(-180deg)}
.num6{transform:rotate(220deg) translateY(-130px) rotate(-220deg)}
.num7{transform:rotate(260deg) translateY(-130px) rotate(-260deg)}
.num8{transform:rotate(300deg) translateY(-130px) rotate(-300deg)}
.num9{transform:rotate(340deg) translateY(-130px) rotate(-340deg)}

.center{
  position:absolute;
  inset:0;
  margin:auto;
  width:80px;height:80px;
  border-radius:50%;
  border:4px solid var(--gold);
  background:#fff;
  font-weight:800;
  cursor:pointer;
}

/* LED */
.led{
  position:absolute;
  top:-22px;left:50%;
  transform:translateX(-50%);
  width:10px;height:10px;
  background:#22c55e;
  border-radius:50%;
  display:none;
}
.led.on{display:block;animation:blink .6s infinite}
@keyframes blink{50%{opacity:.2}}
</style>
</head>

<body>

<!-- HERO -->
<section class="py-24 text-center bg-gradient-to-r from-purple-800 to-violet-600 text-white">
<h1 class="text-4xl md:text-6xl font-extrabold mb-4">हम सब में है कुछ खास</h1>
<p class="opacity-90 mb-6">Know yourself • Trust the Divine power • Create your future</p>
<button class="gold-btn">✨ Explore Numerology</button>
</section>

<!-- WHEEL -->
<section class="py-20 text-center">
<h2 class="text-3xl font-extrabold text-purple-800 mb-4">Numerology Energy Wheel</h2>

<div class="wheel-wrap">
  <div class="pointer"></div>
  <div id="led" class="led"></div>

  <div id="wheel" class="wheel">
    <div class="num num1">1</div><div class="num num2">2</div><div class="num num3">3</div>
    <div class="num num4">4</div><div class="num num5">5</div><div class="num num6">6</div>
    <div class="num num7">7</div><div class="num num8">8</div><div class="num num9">9</div>
  </div>

  <div id="spinBtn" class="center">SPIN</div>
</div>

<div class="mt-6">
  <div id="numText" class="text-xl font-bold"></div>
  <div id="meaningText" class="text-gray-600"></div>
</div>
</section>

<!-- DAILY LUCKY -->
<section class="py-12 text-center bg-white">
<h3 class="text-2xl font-extrabold text-purple-800 mb-3">🎯 Daily Lucky Number</h3>
<input type="date" id="dob" class="border p-2 rounded">
<br><br>
<button onclick="dailyLucky()" class="gold-btn">Calculate</button>
<div id="dailyResult" class="mt-4 font-bold"></div>
</section>

<!-- CONTACT -->
<section class="py-16 text-center">
<h2 class="text-3xl font-extrabold text-purple-800 mb-6">Contact Us</h2>
<div class="max-w-md mx-auto bg-white p-6 rounded-xl">
<input class="w-full border p-3 rounded mb-3" placeholder="Name">
<input class="w-full border p-3 rounded mb-3" placeholder="Mobile">
<textarea class="w-full border p-3 rounded mb-3" placeholder="Message"></textarea>
<button class="gold-btn w-full">Send</button>
</div>
</section>

<footer class="py-10 text-center bg-white">
<p class="mb-4">Kasturi Divine — Numerology for clarity, balance & success</p>
<a class="gold-btn" href="https://chat.whatsapp.com/JyjgJl72hxcDaTGvMe0Ax1">💬 Join WhatsApp Group</a>
</footer>

<a href="https://wa.me/919736317525" class="whatsapp">💬</a>

<script>
const meanings={
1:"Leadership • New Beginnings • Confidence",
2:"Balance • Cooperation • Sensitivity",
3:"Expression • Creativity • Communication",
4:"Stability • Hard Work • Foundation",
5:"Change • Freedom • Adventure",
6:"Responsibility • Care • Harmony",
7:"Wisdom • Spirituality • Inner Search",
8:"Power • Success • Material Growth",
9:"Completion • Humanity • Transformation"
};

let rotation=0;
spinBtn.onclick=()=>{
  led.classList.remove("on");
  const n=Math.floor(Math.random()*9)+1;
  rotation+=360*5+(9-n)*40;
  wheel.style.transform=`rotate(${rotation}deg)`;
  setTimeout(()=>{
    led.classList.add("on");
    numText.innerText="Your Lucky Number: "+n;
    meaningText.innerText=meanings[n];
  },4200);
};

function reduce(num){
  while(num>9) num=[...num.toString()].reduce((a,b)=>a+ +b,0);
  return num;
}
function dailyLucky(){
  const d=document.getElementById("dob").value;
  if(!d) return alert("Select DOB");
  let dob=reduce(d.replaceAll("-","").split("").reduce((a,b)=>a+ +b,0));
  let t=new Date();
  let today=reduce(`${t.getDate()}${t.getMonth()+1}${t.getFullYear()}`.split("").reduce((a,b)=>a+ +b,0));
  document.getElementById("dailyResult").innerText="✨ Daily Lucky Number: "+reduce(dob+today);
}
</script>

</body>
</html>
